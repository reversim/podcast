name = "reversim-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
account_id = "bddcd14d3bb33ee6bdb8cfff3cab9b37"
workers_dev = false
preview_urls = false

# Public, read-only MCP server over the episode archive.
routes = [{ pattern = "mcp.reversim.com", custom_domain = true }]

[vars]
SITE = "https://www.reversim.com"

[[d1_databases]]
binding = "ARCHIVE"
database_name = "reversim-archive"
database_id = "f168da36-cac8-4c67-9325-5290bc6dcf57"

# The analytics database. The Worker writes one row for each client, day and tool (table mcp_hits).
# It also needs the secret HASH_SALT (wrangler secret put HASH_SALT). Without it, nothing is counted.
[[d1_databases]]
binding = "STATS"
database_name = "reversim-analytics"
database_id = "b4116abf-07f9-4f09-bda2-c120c477af8f"
