name = "reversim-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
account_id = "bddcd14d3bb33ee6bdb8cfff3cab9b37"
workers_dev = false
preview_urls = false

# Public, read-only MCP server over the episode archive. Enable the route at the first deploy.
# routes = [{ pattern = "mcp.reversim.com", custom_domain = true }]

[vars]
SITE = "https://www.reversim.com"

[[d1_databases]]
binding = "ARCHIVE"
database_name = "reversim-archive"
# Create it one time with `npx wrangler d1 create reversim-archive`, then put the id here.
database_id = "00000000-0000-0000-0000-000000000000"
